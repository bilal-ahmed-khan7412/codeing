<!doctype html>
<html>
<head>
<title>Pending Approval</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6fb;
    margin:0;
    color:#1f2937;
}

header{
    background:#305496;
    color:white;
    padding:18px 28px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header a{
    color:white;
    font-weight:700;
}

main{
    max-width:1100px;
    margin:0 auto;
    padding:20px;
}

.card{
    background:white;
    border:1px solid #d9e2ef;
    border-radius:14px;
    padding:24px;
    box-shadow:0 4px 16px rgba(15,23,42,.06);
    max-width:560px;
    margin:40px auto;
}

.btn{
    display:inline-block;
    background:#305496;
    color:white;
    text-decoration:none;
    padding:10px 18px;
    border-radius:10px;
    font-weight:700;
    margin-top:16px;
}
</style>
</head>

<body>

<header>
    <h2>Pending Approval</h2>
    <div>
        /login
    </div>
</header>

<main>
    <div class="card">
        <h2>Your request is pending</h2>

        <p>
            Your access request has been submitted.
            Please wait for an Admin or Super Admin to approve your account.
        </p>

<div style="margin-top:20px;">
    <a href="/login"
       style="
            display:inline-block;
            background:#305496;
            color:white;
            text-decoration:none;
            padding:10px 18px;
            border-radius:10px;
            font-weight:700;
       ">
       Back to Login
        </a>
    </div>
</main>

</body>
</html>
