<!doctype html><html><head><title>Task Tracker</title>
<link rel="stylesheet" href="/static/css/app.css">
</head><body>
<div class="appshell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="kicker">Team</div>
    <h2 style="margin:0 0 20px">Task Tracker</h2>
    <div class="card blueprint elev-sm" style="padding:20px">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <h3 style="margin:0 0 10px">Create Task</h3>
      <div class="grid-2">
        <div class="field"><label>Title</label><input id="title"></div>
        <div class="field"><label>Assigned To</label><input id="assigned_to"></div>
        <div class="field"><label>Category</label><select id="category"><option>Frontend</option><option>Backend</option><option>LLM</option><option>Workbook</option><option>Governance</option><option>Bug</option><option>Deployment</option></select></div>
        <div class="field"><label>Priority</label><select id="priority"><option>Low</option><option selected>Medium</option><option>High</option></select></div>
        <div class="field"><label>Status</label><select id="status"><option>Pending</option><option>In Progress</option><option>Blocked</option><option>Completed</option><option>Cancelled</option></select></div>
        <div class="field"><label>Due Date</label><input id="due_date"></div>
      </div>
      <div class="field"><label>Description</label><textarea id="description"></textarea></div>
      <div class="field"><label>Remarks</label><textarea id="remarks"></textarea></div>
      <button onclick="addTask()">Add Task</button>
    </div>
    <div class="card blueprint elev-sm" style="padding:20px;overflow-x:auto">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <h3 style="margin:0 0 10px">Tasks</h3>
      <table><thead><tr><th>ID</th><th>Title</th><th>Category</th><th>Priority</th><th>Status</th><th>Assigned</th><th>Created By</th><th>Due</th><th>Remarks</th></tr></thead><tbody id="rows"></tbody></table>
    </div>
  </main>
</div>
<script src="/static/js/nav.js"></script>
<script>
function escapeHtml(s){ return String(s ?? '').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function load(){const r=await fetch('/api/tasks');const d=await r.json();rows.innerHTML=(d.tasks||[]).map(t=>`<tr><td>${t.id}</td><td>${escapeHtml(t.title)}</td><td>${escapeHtml(t.category)}</td><td>${escapeHtml(t.priority)}</td><td>${escapeHtml(t.status)}</td><td>${escapeHtml(t.assigned_to)}</td><td>${escapeHtml(t.created_by)}</td><td>${escapeHtml(t.due_date)}</td><td>${escapeHtml(t.remarks)}</td></tr>`).join('')}
async function addTask(){await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.value,description:description.value,category:category.value,priority:priority.value,status:status.value,assigned_to:assigned_to.value,due_date:due_date.value,remarks:remarks.value})});load()}load();
renderNav();
</script>
</body></html>
