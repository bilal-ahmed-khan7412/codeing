<!doctype html><html><head><title>Task Tracker</title>
<link rel="stylesheet" href="/static/css/app.css">
</head><body>
<header><h2>Task Tracker</h2><div id="nav"></div></header>
<main><div class="card"><h3>Create Task</h3><div class="grid-2"><label>Title<input id="title"></label><label>Assigned To<input id="assigned_to"></label><label>Category<select id="category"><option>Frontend</option><option>Backend</option><option>LLM</option><option>Workbook</option><option>Governance</option><option>Bug</option><option>Deployment</option></select></label><label>Priority<select id="priority"><option>Low</option><option selected>Medium</option><option>High</option></select></label><label>Status<select id="status"><option>Pending</option><option>In Progress</option><option>Blocked</option><option>Completed</option><option>Cancelled</option></select></label><label>Due Date<input id="due_date"></label></div><label>Description<textarea id="description"></textarea></label><label>Remarks<textarea id="remarks"></textarea></label><button onclick="addTask()">Add Task</button></div><div class="card"><h3>Tasks</h3><table><thead><tr><th>ID</th><th>Title</th><th>Category</th><th>Priority</th><th>Status</th><th>Assigned</th><th>Created By</th><th>Due</th><th>Remarks</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script src="/static/js/nav.js"></script>
<script>
function escapeHtml(s){ return String(s ?? '').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function load(){const r=await fetch('/api/tasks');const d=await r.json();rows.innerHTML=(d.tasks||[]).map(t=>`<tr><td>${t.id}</td><td>${escapeHtml(t.title)}</td><td>${escapeHtml(t.category)}</td><td>${escapeHtml(t.priority)}</td><td>${escapeHtml(t.status)}</td><td>${escapeHtml(t.assigned_to)}</td><td>${escapeHtml(t.created_by)}</td><td>${escapeHtml(t.due_date)}</td><td>${escapeHtml(t.remarks)}</td></tr>`).join('')}
async function addTask(){await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.value,description:description.value,category:category.value,priority:priority.value,status:status.value,assigned_to:assigned_to.value,due_date:due_date.value,remarks:remarks.value})});load()}load();
renderNav();
</script>
</body></html>
