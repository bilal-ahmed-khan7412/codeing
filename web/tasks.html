<!doctype html><html><head><title>Create Ticket</title>
<link rel="stylesheet" href="/static/css/app.css">
</head><body>
<div class="appshell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="kicker">Team</div>
    <h2 style="margin:0 0 20px">Create Ticket</h2>
    <div class="card blueprint elev-sm" style="padding:20px" id="createCard">

      <h3 style="margin:0 0 10px">Create Ticket</h3>
      <div class="grid-2">
        <div class="field"><label>Title</label><input id="title"></div>
        <div class="field"><label>Category</label><select id="category"><option>Frontend</option><option>Backend</option><option>LLM</option><option>Workbook</option><option>Governance</option><option>Bug</option><option>Deployment</option><option>API Key Request</option></select></div>
        <div class="field"><label>Priority</label><select id="priority"><option>Low</option><option selected>Medium</option><option>High</option></select></div>
        <div class="field"><label>Status</label><select id="status"><option>Pending</option><option>In Progress</option><option>Blocked</option><option>Completed</option><option>Cancelled</option></select></div>
        <div class="field"><label>Due Date</label><input type="date" id="due_date"></div>
      </div>
      <div class="field"><label>Description</label><textarea id="description" maxlength="200"></textarea></div>
      <div class="field"><label>Remarks</label><textarea id="remarks"></textarea></div>
      <button onclick="addTask()">Add Ticket</button>
      <p id="createMsg"></p>
    </div>
    <div class="card blueprint elev-sm" style="padding:20px" id="requestKeyCard">
      <h3 style="margin:0 0 10px">Request API Key</h3>
      <p class="muted">Ask an admin to set up an AI provider API key for your account.</p>
      <div class="field"><label>Note (optional)</label><textarea id="apiKeyNote" placeholder="Anything specific to mention"></textarea></div>
      <button onclick="requestApiKey()">Request API Key</button>
      <p id="apiKeyMsg"></p>
    </div>
  </main>
</div>
<script src="/static/js/nav.js"></script>
<script>
async function addTask(){
  if(!title.value.trim()){ createMsg.textContent='Title is required.'; return; }
  const r=await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.value,description:description.value,category:category.value,priority:priority.value,status:status.value,assigned_to:'',due_date:due_date.value,remarks:remarks.value})});
  const d=await r.json();
  createMsg.textContent=d.ok?'Ticket created.':(d.error||'Error');
  if(d.ok){ title.value=''; description.value=''; remarks.value=''; due_date.value=''; }
}
async function requestApiKey(){
  const r=await fetch('/api/tasks/request-api-key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({note:apiKeyNote.value})});
  const d=await r.json();
  apiKeyMsg.textContent=d.ok?'Requested - an admin will follow up.':(d.error||'Error');
  if(d.ok){ apiKeyNote.value=''; }
}
renderNav();
</script>
</body></html>
