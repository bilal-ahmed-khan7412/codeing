<!doctype html>
<html>
<head><title>Request Access</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fb;margin:0;color:#1f2937}
header{background:#305496;color:white;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}
header a{color:white;font-weight:700;margin-left:14px}
main{max-width:1100px;margin:0 auto;padding:20px}
.card{background:white;border:1px solid #d9e2ef;border-radius:14px;padding:16px;box-shadow:0 4px 16px rgba(15,23,42,.06);margin-bottom:16px}
input{padding:10px;border:1px solid #d9e2ef;border-radius:9px;font:inherit;width:100%;box-sizing:border-box}
label{display:flex;flex-direction:column;gap:6px;font-weight:700;margin:8px 0}
button{background:#305496;color:white;border:none;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
button:disabled{opacity:.65;cursor:not-allowed}.muted{color:#64748b;font-size:13px}.error{color:#991b1b;font-weight:700}.success{color:#166534;font-weight:700}
</style>
</head>
<body>
<header><h2>Request Access</h2><div><a href="/login">Login</a></div></header>
<main>
  <div class="card" style="max-width:520px;margin:40px auto;">
    <h2>Create access request</h2>
    <p class="muted">Your account will be pending until an Admin or Super Admin approves it.</p>
    <label>Name<input id="signup_name" autocomplete="name"></label>
    <label>Email<input id="signup_email" autocomplete="email"></label>
    <label>Password<input id="signup_password" type="password" autocomplete="new-password"></label>
    <label>Department<input id="signup_department"></label>
    <button id="signup_btn" onclick="signupRequest()">Submit Request</button>
    <p id="signup_msg" class="muted"></p>
  </div>
</main>
<script>
function byId(id) { return document.getElementById(id); }
function getVal(id) { const el = byId(id); return el ? String(el.value || '').trim() : ''; }
async function signupRequest() {
  const btn = byId('signup_btn');
  const msg = byId('signup_msg');
  msg.className = 'muted';
  msg.textContent = 'Submitting...';
  btn.disabled = true;
  const payload = {
    name: getVal('signup_name'),
    email: getVal('signup_email'),
    password: getVal('signup_password'),
    department: getVal('signup_department')
  };
  if(!payload.name || !payload.email || !payload.password) {
    msg.className = 'error';
    msg.textContent = 'Name, email, and password are required.';
    btn.disabled = false;
    return;
  }
  try {
    const r = await fetch('/api/signup', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    let d = {};
    try { d = await r.json(); } catch(e) { d = {error:'Server did not return JSON.'}; }
    if(d.ok) {
      msg.className = 'success';
      msg.textContent = d.message || 'Signup request submitted. Please wait for approval.';
      setTimeout(()=>location.href='/pending', 1500);
    } else {
      msg.className = 'error';
      msg.textContent = d.error || 'Signup failed.';
      btn.disabled = false;
    }
  } catch(e) {
    msg.className = 'error';
    msg.textContent = 'Signup failed: ' + e.message;
    btn.disabled = false;
  }
}
</script>
</body>
</html>
