<!doctype html><html><head><title>Request Access</title>
<link rel="stylesheet" href="/static/css/app.css">
</head><body>
<div class="authgrid">
  <div class="authside">
    <div class="authside-brand">Intern Tracker</div>
    <div>
      <div class="kicker" style="color:color-mix(in srgb, var(--color-bg) 70%, transparent)">Operations console</div>
      <h1>Every request, reviewed before it touches the workbook.</h1>
      <p style="font-size:14px;opacity:.75;max-width:34ch">New accounts stay pending until an Admin or Super Admin approves them.</p>
    </div>
    <div class="authside-spacer"></div>
  </div>
  <div class="authmain">
    <div class="card blueprint elev-sm authcard" style="width:min(480px,100%)">
      
      <h3 style="margin:0 0 4px">Create access request</h3>
      <p class="muted">Your account will be pending until an Admin or Super Admin approves it.</p>
      <div class="field"><label>Name</label><input id="signup_name" autocomplete="name"></div>
      <div class="field"><label>Email</label><input id="signup_email" autocomplete="email"></div>
      <div class="field"><label>Password</label><input id="signup_password" type="password" autocomplete="new-password"></div>
      <div class="field"><label>Department</label><input id="signup_department"></div>
      <button id="signup_btn" class="btn btn-primary btn-block" onclick="signupRequest()">Submit Request</button>
      <p id="signup_msg" class="muted"></p>
      <p class="muted" style="margin-top:10px"><a href="/login">Back to login</a></p>
    </div>
  </div>
</div>
<script>
function byId(id) { return document.getElementById(id); }
function getVal(id) { const el = byId(id); return el ? String(el.value || '').trim() : ''; }
async function signupRequest() {
  const btn = byId('signup_btn');
  const msg = byId('signup_msg');
  msg.className = 'muted';
  msg.textContent = 'Submitting...';
  btn.disabled = true;
  const payload = {
    name: getVal('signup_name'),
    email: getVal('signup_email'),
    password: getVal('signup_password'),
    department: getVal('signup_department')
  };
  if(!payload.name || !payload.email || !payload.password) {
    msg.className = 'error';
    msg.textContent = 'Name, email, and password are required.';
    btn.disabled = false;
    return;
  }
  try {
    const r = await fetch('/api/signup', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    let d = {};
    try { d = await r.json(); } catch(e) { d = {error:'Server did not return JSON.'}; }
    if(d.ok) {
      msg.className = 'success';
      msg.textContent = d.message || 'Signup request submitted. Please wait for approval.';
      setTimeout(()=>location.href='/pending', 1500);
    } else {
      msg.className = 'error';
      msg.textContent = d.error || 'Signup failed.';
      btn.disabled = false;
    }
  } catch(e) {
    msg.className = 'error';
    msg.textContent = 'Signup failed: ' + e.message;
    btn.disabled = false;
  }
}
</script>
</body></html>
