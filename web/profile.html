<!doctype html><html><head><title>Profile</title>
<link rel="stylesheet" href="/static/css/app.css">
</head><body>
<div class="appshell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" style="max-width:640px">
    <div class="kicker">Account</div>
    <h2 style="margin:0 0 20px">Profile</h2>
    <div class="card blueprint elev-sm" style="padding:22px;max-width:560px">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <h3 style="margin:0 0 4px">Update profile</h3>
      <p class="muted">Super Admin should change the temporary bootstrap email/password after first login.</p>
      <div class="field"><label>Name</label><input id="name"></div>
      <div class="field"><label>Email</label><input id="email"></div>
      <div class="field"><label>Department</label><input id="department"></div>
      <div class="field"><label>New Password</label><input id="password" type="password"></div>
      <button onclick="save()">Save</button>
      <p id="msg"></p>
    </div>
  </main>
</div>
<script src="/static/js/nav.js"></script>
<script>
async function me(){const r=await fetch('/api/me');const d=await r.json();if(d.user){name.value=d.user.name||'';email.value=d.user.email||'';department.value=d.user.department||'';}};
async function save(){const r=await fetch('/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,email:email.value,department:department.value,password:password.value})});const d=await r.json();msg.textContent=d.ok?'Saved.':(d.error||'Error');}me();
renderNav();
</script>
</body></html>
