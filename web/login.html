<!doctype html><html><head><title>Login</title>
<link rel="stylesheet" href="/static/css/app.css">
</head><body>
<div class="authgrid">
  <div class="authside">
    <div class="authside-brand">Intern Tracker</div>
    <div>
      <div class="kicker" style="color:color-mix(in srgb, var(--color-bg) 70%, transparent)">Operations console</div>
      <h1>One workbook. Every intern, plan, and review in sync.</h1>
      <p style="font-size:14px;opacity:.75;max-width:34ch">Role-based access, an auditable command layer, and a guided evaluation wizard, all built on the tracker workbook.</p>
    </div>
    <div class="authside-spacer"></div>
  </div>
  <div class="authmain">
    <div class="card blueprint elev-sm authcard">
      
      <div style="text-align:center;margin-bottom:16px">
        <div style="font-family:var(--font-heading);font-weight:600;font-size:24px">Intern Tracker</div>
        <div class="text-muted" style="font-size:13px;margin-top:4px">Sign in to continue</div>
      </div>
      <form id="loginForm" onsubmit="event.preventDefault(); login();">
        <div class="field"><label>Email</label><input id="email" autocomplete="username" placeholder="Enter your email"></div>
        <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password"></div>
        <button id="loginBtn" type="submit" class="btn btn-primary btn-block">Login</button>
      </form>
      <p class="text-muted" style="font-size:12px;margin:10px 0 2px"><a href="/forgot-password">Forgot password?</a></p>
      <p class="text-muted" style="font-size:12px;margin:0 0 10px"><a href="/signup">Request access</a></p>
      <p id="msg" class="text-muted" style="font-size:13px"></p>
    </div>
  </div>
</div>
<script>
async function login(){
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  msg.textContent = '';
  try{
    const r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});
    const d = await r.json();
    if(d.ok){ location.href='/'; return; }
    msg.textContent = d.error || 'Login failed';
  }catch(e){
    msg.textContent = 'Login failed: ' + e.message;
  }
  btn.disabled = false;
}
</script>
</body></html>
