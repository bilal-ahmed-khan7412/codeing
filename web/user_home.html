<!doctype html><html><head><title>Dashboard</title>
<link rel="stylesheet" href="/static/css/app.css">
</head><body>
<div class="appshell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="card blueprint elev-sm" style="padding:22px">
      
      <span class="tag tag-accent" id="userRole">User</span>
      <h2 style="margin:8px 0 2px" id="welcome">Welcome</h2>
      <p class="text-muted" id="userEmail" style="margin:0"></p>
      <p style="margin:10px 0 0;font-size:14px">Use the Chat Assistant to check progress, add interns, and update the tracker.</p>
    </div>
    <div class="grid">
      <div class="card blueprint elev-sm">
        
        <div class="card-kicker">Assistant</div>
        <div class="card-title">Chat Assistant</div>
        <p class="card-body">Ask for summaries and perform allowed tracker operations using the assistant.</p>
        <a class="btn btn-secondary" href="/chat" style="width:fit-content;margin-top:10px">Open Chat</a>
      </div>
      <div class="card blueprint elev-sm">

        <div class="card-kicker">Account</div>
        <div class="card-title">Profile</div>
        <p class="card-body">View or update your own profile information.</p>
        <a class="btn btn-secondary" href="/profile" style="width:fit-content;margin-top:10px">Open Profile</a>
      </div>
    </div>
  </main>
</div>
<script src="/static/js/nav.js"></script>
<script>
async function loadMe(){
  try{
    const r = await fetch('/api/me');
    const d = await r.json();
    const u = d.user || {};
    document.getElementById('welcome').textContent = 'Welcome, ' + (u.name || 'User');
    document.getElementById('userEmail').textContent = u.email || '';
    document.getElementById('userRole').textContent = u.role || 'User';
  }catch(e){
    document.getElementById('welcome').textContent = 'Welcome';
    document.getElementById('userEmail').textContent = 'Could not load your profile. Try refreshing the page.';
  }
}
loadMe();
renderNav();
</script>
</body></html>
